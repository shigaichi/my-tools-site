<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link href="./style.css" rel="stylesheet" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    {{>header}}
    <main class="max-w-2xl mx-auto p-6">
      <form class="space-y-6 bg-white shadow-md rounded-lg p-6">
        <!-- 性別 -->
        <div>
          <label class="block font-medium text-gray-700 mb-1">性別</label>
          <select
            name="gender"
            class="w-full border border-gray-300 rounded p-2"
          >
            <option value="">選択してください</option>
            <option value="男性">男性</option>
            <option value="女性">女性</option>
          </select>
        </div>

        <!-- 年齢 -->
        <div>
          <label class="block font-medium text-gray-700 mb-1">年齢</label>
          <input
            type="number"
            name="age"
            min="15"
            max="64"
            class="w-full border border-gray-300 rounded p-2"
            placeholder="例：25"
          />
        </div>

        <!-- 腕立て伏せ -->
        <div>
          <label class="block font-medium text-gray-700 mb-1"
            >腕立て伏せ（回数）</label
          >
          <input
            type="number"
            name="pushups"
            min="0"
            class="w-full border border-gray-300 rounded p-2"
          />
        </div>

        <!-- 腹筋 -->
        <div>
          <label class="block font-medium text-gray-700 mb-1"
            >腹筋（回数）</label
          >
          <input
            type="number"
            name="situps"
            min="0"
            class="w-full border border-gray-300 rounded p-2"
          />
        </div>

        <!-- 3km走（分・秒） -->
        <div>
          <label class="block font-medium text-gray-700 mb-1"
            >3km走（分・秒）</label
          >
          <div class="flex gap-2">
            <input
              type="number"
              name="run_minutes"
              min="0"
              class="w-1/2 border border-gray-300 rounded p-2"
              placeholder="分"
            />
            <input
              type="number"
              name="run_seconds"
              min="0"
              max="59"
              class="w-1/2 border border-gray-300 rounded p-2"
              placeholder="秒"
            />
          </div>
        </div>

        <div class="text-center">
          <button
            type="submit"
            class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded"
          >
            計算する
          </button>
        </div>
      </form>
    </main>
    {{>footer}}
  </body>
</html>
